name: Fila do RU

on:
  schedule:
    # A cada 10 min no almoço (10:30-13:50) e no jantar (17:00-19:20), horário de Brasília
    - cron: "30-59/10 13 * * *"
    - cron: "*/10 14-16 * * *"
    - cron: "*/10 20-21 * * *"
    - cron: "0-20/10 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fila
  cancel-in-progress: true

jobs:
  fila:
    runs-on: ubuntu-latest
    env:
      NTFY_CANAL: ${{ vars.NTFY_CANAL }}
      PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fila.txt
      - run: pip install -r requirements-fila.txt
      - uses: actions/cache@v4
        with:
          path: yolo11s.pt
          key: yolo11s
      - run: python fila.py
      - name: Publicar leitura
        run: |
          git config user.name "cardapio-bot"
          git config user.email "cardapio-bot@users.noreply.github.com"
          git add docs/fila.json
          git diff --cached --quiet || git commit -m "Atualiza fila"
          git pull --rebase
          git push
      - name: Alertar se a fila ficou grande
        # Só liga depois de calibrar os limites: crie a variável ALERTA_FILA com o valor "sim"
        if: vars.ALERTA_FILA == 'sim'
        run: python avisar.py --fila
